name: SOLVA MILC Model Evaluation (Provider-Gated)

on:
  workflow_dispatch:
  push:
    paths:
      - 'solva/communication/model_eval/**'
      - 'solva/communication/tests/milc_model_eval_corpus_v1_0.json'
      - '.github/workflows/solva-milc-model-eval.yml'

jobs:
  model-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate model-eval assets
        run: python -c "import json; d=json.load(open('solva/communication/tests/milc_model_eval_corpus_v1_0.json')); assert len(d['cases'])==22; print('MODEL_EVAL_CORPUS_READY: 22 cases')"
      - name: Run provider-neutral validator tests
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest solva/communication/model_eval/tests/test_provider_result_validator.py -q
      - name: Determine provider state
        id: provider
        env:
          SOLVA_MODEL_PROVIDER: ${{ vars.SOLVA_MODEL_PROVIDER }}
          SOLVA_MODEL_ENDPOINT: ${{ vars.SOLVA_MODEL_ENDPOINT }}
        run: |
          if [ -z "$SOLVA_MODEL_PROVIDER" ] || [ -z "$SOLVA_MODEL_ENDPOINT" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "MODEL_EVAL_STATUS=UNKNOWN_NO_PROVIDER"
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "MODEL_EVAL_STATUS=PROVIDER_CONFIGURED"
      - name: Refuse false live PASS
        if: steps.provider.outputs.configured == 'true'
        run: |
          echo "LIVE_MODEL_EXECUTION_STATUS=BLOCKED_NO_PROVIDER_ADAPTER"
          echo "Provider configuration exists, but no provider-specific adapter is installed."
          exit 1
